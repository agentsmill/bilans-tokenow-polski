<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bilans tokenów Polski — symulator data center AI</title>
<meta name="description" content="Interaktywny symulator data center AI w Polsce: bilans importu/eksportu tokenów wobec mocy obliczeniowej i sufitu energetycznego (KSE).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Spectral:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060a09; --bg2:#08100e; --panel:#0b1311; --panel2:#0f1a17;
    --line:#1a2a25; --ink:#e9f3ef; --soft:#a4b6ae; --mut:#6f837b; --mut2:#42514b;
    --acc:#00FF8C; --red:#FF5A5F; --amber:#FFB547;
    --mono:'Space Mono', ui-monospace, monospace;
    --sans:'IBM Plex Sans', system-ui, sans-serif;
    --display:'Instrument Serif', Georgia, serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    background-image:radial-gradient(120% 80% at 30% -10%, #0c1714 0%, var(--bg) 55%);}
  .kicker{font-family:var(--mono);font-size:11px;text-transform:uppercase;
    letter-spacing:.18em;color:var(--mut)}

  /* ------------------------------- TOPBAR ------------------------------- */
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:24px;
    padding:18px 32px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:14px}
  .brand-mark{width:38px;height:38px;border:1px solid var(--line);border-radius:9px;
    display:grid;place-items:center;background:var(--panel2)}
  .bm-dot{width:11px;height:11px;border-radius:50%;background:var(--acc);
    box-shadow:0 0 0 0 var(--acc);animation:beat 2.4s ease-out infinite}
  @keyframes beat{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--acc) 60%,transparent)}
    70%{box-shadow:0 0 0 12px transparent}100%{box-shadow:0 0 0 0 transparent}}
  .brand-txt h1{margin:0;font-family:var(--display);font-weight:500;font-size:27px;
    line-height:1;letter-spacing:.01em}
  .brand-txt p{margin:4px 0 0;font-family:var(--mono);font-size:11px;color:var(--mut);
    text-transform:uppercase;letter-spacing:.1em}
  .topreadout{display:flex;align-items:center;gap:18px}
  .tr-item{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
  .tr-val{font-family:var(--mono);font-weight:700;font-size:19px;color:var(--ink)}
  .tr-unit{font-family:var(--mono);font-size:9.5px;color:var(--mut);text-transform:uppercase;
    letter-spacing:.1em;margin-top:2px}
  .tr-sep{width:1px;height:26px;background:var(--line)}
  .btn-reset{margin-left:6px;background:transparent;border:1px solid var(--line);color:var(--mut);
    font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;
    padding:9px 13px;border-radius:7px;cursor:pointer;transition:.15s}
  .btn-reset:hover{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 50%,var(--line))}

  /* ------------------------------- LAYOUT ------------------------------- */
  .layout{display:grid;grid-template-columns:minmax(0,1.42fr) minmax(372px,1fr);
    gap:26px;padding:26px 32px 32px;align-items:start}

  /* --------------------------------- MAP -------------------------------- */
  .mapwrap{background:linear-gradient(180deg,var(--panel) 0%,var(--bg2) 100%);
    border:1px solid var(--line);border-radius:16px;padding:16px 16px 6px;position:relative}
  .map-svg{width:100%;height:auto;max-height:76vh;display:block}
  .app.no-tex .map-svg path[fill="url(#grid)"]{opacity:0}
  .pin-power{font-family:var(--mono);font-weight:700;fill:#fff;paint-order:stroke;
    stroke:#04140e;stroke-width:5px;stroke-linejoin:round}
  .pin-name{font-family:var(--mono);font-size:16px;fill:#9fb4ab;paint-order:stroke;
    stroke:#04140e;stroke-width:4px;stroke-linejoin:round}
  .ref-label{font-family:var(--mono);font-size:15px;fill:#6f837b;font-style:italic}
  .pin-glow{filter:blur(6px)}
  .pin-pulse{animation:pinPulse 3.2s ease-out infinite}
  @keyframes pinPulse{0%{transform:scale(1);opacity:.5}70%{transform:scale(2);opacity:0}
    100%{transform:scale(2);opacity:0}}
  .flow-dash{animation:flowMove 1s linear infinite}
  @keyframes flowMove{to{stroke-dashoffset:-32}}
  .flow-label{font-family:var(--mono);font-weight:700;font-size:21px;letter-spacing:.14em}
  .flow-num{font-family:var(--mono);font-size:19px}
  .map-hint{font-family:var(--mono);font-size:11px;color:var(--mut);text-align:center;
    padding:10px 0 8px}
  .mh-key{color:var(--acc);font-weight:700}

  /* -------------------------------- PANEL ------------------------------- */
  .panel{display:flex;flex-direction:column;gap:18px}
  .panel-block{display:flex;flex-direction:column;gap:11px}
  .stage-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .stage-btn{display:flex;flex-direction:column;gap:3px;padding:11px 9px;text-align:left;
    background:var(--panel2);border:1px solid var(--line);border-radius:9px;cursor:pointer;
    transition:.15s}
  .stage-btn:hover{border-color:color-mix(in srgb,var(--acc) 40%,var(--line))}
  .stage-btn.active{border-color:var(--acc);
    background:color-mix(in srgb,var(--acc) 8%,var(--panel2))}
  .stage-idx{font-family:var(--mono);font-size:10px;color:var(--mut)}
  .stage-label{font-family:var(--sans);font-weight:600;font-size:12.5px;color:var(--soft)}
  .stage-btn.active .stage-label{color:var(--acc)}
  .stage-sub{font-family:var(--mono);font-size:9.5px;color:var(--mut)}
  .stage-blurb{margin:0;font-size:12.5px;line-height:1.5;color:var(--soft)}

  .balance{padding:22px;border-radius:14px;border:1px solid var(--line);position:relative;
    overflow:hidden}
  .balance.is-exp{background:radial-gradient(130% 100% at 100% 0%,
    color-mix(in srgb,var(--acc) 14%,var(--panel)) 0%, var(--panel) 60%);
    border-color:color-mix(in srgb,var(--acc) 35%,var(--line))}
  .balance.is-imp{background:radial-gradient(130% 100% at 100% 0%,
    color-mix(in srgb,var(--red) 16%,var(--panel)) 0%, var(--panel) 60%);
    border-color:color-mix(in srgb,var(--red) 35%,var(--line))}
  .balance-top{display:flex;justify-content:space-between;align-items:center}
  .balance-arrow{font-size:26px;line-height:1}
  .is-exp .balance-arrow{color:var(--acc)} .is-imp .balance-arrow{color:var(--red)}
  .balance-word{font-family:var(--display);font-size:62px;line-height:.95;margin-top:6px;
    letter-spacing:.01em}
  .is-exp .balance-word{color:var(--acc)} .is-imp .balance-word{color:var(--red)}
  .balance-net{font-family:var(--mono);font-weight:700;font-size:23px;color:var(--ink);margin-top:10px}
  .balance-unit{color:var(--mut);font-size:13px;font-weight:400}
  .balance-cov{font-family:var(--mono);font-size:11px;color:var(--mut);margin-top:8px;
    text-transform:uppercase;letter-spacing:.1em}

  .gauge{display:flex;flex-direction:column;gap:11px}
  .gauge-row{display:grid;grid-template-columns:54px 1fr auto;align-items:center;gap:10px}
  .gauge-tag{font-family:var(--mono);font-size:10.5px;color:var(--mut);text-transform:uppercase;
    letter-spacing:.08em}
  .gauge-track{height:11px;background:var(--panel2);border:1px solid var(--line);
    border-radius:6px;overflow:hidden}
  .gauge-fill{height:100%;border-radius:6px;transition:width .5s cubic-bezier(.2,.7,.2,1)}
  .gauge-fill.sup{background:linear-gradient(90deg,
    color-mix(in srgb,var(--acc) 70%,#04140e),var(--acc))}
  .gauge-fill.dem{background:linear-gradient(90deg,
    color-mix(in srgb,var(--amber) 78%,#150d02),var(--amber))}
  .gauge-val{font-family:var(--mono);font-size:11.5px;color:var(--soft);
    min-width:86px;text-align:right}

  .breakdown{display:flex;flex-direction:column;gap:8px}
  .bd-head{display:flex;justify-content:space-between;align-items:baseline}
  .bd-fte{font-family:var(--mono);font-size:12px;color:var(--acc)}
  .bd-bar{height:14px;display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .bd-seg{height:100%;transition:width .5s cubic-bezier(.2,.7,.2,1)}
  .bd-seg.cons{background:#43756a} .bd-seg.agen{background:var(--acc)}
  .bd-legend{display:flex;gap:18px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--soft)}
  .dot{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:7px;vertical-align:middle}
  .dot.cons{background:#43756a} .dot.agen{background:var(--acc)}

  .stats{display:flex;flex-direction:column;gap:9px}
  .stat{display:flex;justify-content:space-between;align-items:center;gap:14px;
    padding:13px 15px;background:var(--panel2);border:1px solid var(--line);border-radius:9px}
  .stat-info{display:flex;flex-direction:column;gap:3px}
  .stat-label{font-family:var(--mono);font-size:10.5px;color:var(--mut);text-transform:uppercase;
    letter-spacing:.07em}
  .stat-sub{font-family:var(--mono);font-size:10px;color:var(--mut2)}
  .stat-value{font-family:var(--display);font-size:31px;color:var(--ink);white-space:nowrap;line-height:1}
  .stat-unit{font-family:var(--mono);font-size:12px;color:var(--mut);margin-left:1px}
  .stat.tone-warn .stat-value{color:var(--amber)}

  .advanced{border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .adv-toggle{width:100%;display:flex;justify-content:space-between;align-items:center;
    padding:12px 15px;background:var(--panel2);border:none;color:var(--soft);
    font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.1em;cursor:pointer}
  .adv-chevron{color:var(--acc);font-size:16px}
  .adv-body{padding:15px;display:flex;flex-direction:column;gap:15px}
  .slider{display:flex;flex-direction:column;gap:8px}
  .slider-head{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11.5px;
    color:var(--soft)}
  .slider-val{color:var(--acc);font-weight:700}
  .adv-derived{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);
    font-size:10.5px;color:var(--mut);border-top:1px solid var(--line);padding-top:12px}

  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;
    background:var(--line);border-radius:3px;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;
    border-radius:50%;background:var(--acc);cursor:pointer;border:2px solid #04140e;
    box-shadow:0 0 8px color-mix(in srgb,var(--acc) 60%,transparent)}
  input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;
    background:var(--acc);cursor:pointer;border:2px solid #04140e}

  /* ----------------------------- CONCLUSIONS ---------------------------- */
  .conclusions{padding:50px 32px 12px;border-top:1px solid var(--line)}
  .conc-head h2{margin:8px 0 0;font-family:var(--display);font-weight:500;font-size:42px;
    line-height:1.04;max-width:20ch;color:var(--ink)}
  .wnioski{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:1px;
    background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;
    margin-top:30px}
  .wniosek{background:var(--panel);padding:24px;display:flex;gap:16px}
  .wniosek-n{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--acc);padding-top:2px}
  .wniosek h3{margin:0 0 9px;font-family:var(--sans);font-size:15.5px;font-weight:600;color:var(--ink);
    line-height:1.25}
  .wniosek p{margin:0;font-family:var(--sans);font-size:13px;line-height:1.62;color:var(--soft)}
  .methodology{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin-top:34px;
    padding-top:28px;border-top:1px solid var(--line)}
  .meth-col h4{margin:0 0 8px;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;
    letter-spacing:.12em;color:var(--acc)}
  .meth-col p{margin:0;font-family:var(--sans);font-size:12px;line-height:1.6;color:var(--mut)}

  .foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:24px 32px 30px;
    font-family:var(--mono);font-size:10.5px;color:var(--mut2)}

  /* ------------------------------- MODAL -------------------------------- */
  .modal-scrim{position:fixed;inset:0;background:rgba(2,6,5,.74);backdrop-filter:blur(5px);
    display:grid;place-items:center;z-index:200;padding:20px;animation:fade .2s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{width:392px;max-width:100%;background:var(--panel);border:1px solid
    color-mix(in srgb,var(--acc) 22%,var(--line));border-radius:16px;padding:24px;
    box-shadow:0 30px 90px rgba(0,0,0,.6)}
  .modal-head{display:flex;justify-content:space-between;align-items:center}
  .modal-x{background:none;border:none;color:var(--mut);font-size:24px;cursor:pointer;line-height:1}
  .modal-x:hover{color:var(--ink)}
  .field{display:flex;flex-direction:column;gap:9px;margin-top:18px}
  .field>span{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--mut)}
  .field input[type=text]{background:var(--panel2);border:1px solid var(--line);border-radius:9px;
    padding:11px 13px;color:var(--ink);font-family:var(--sans);font-size:14px;outline:none}
  .field input[type=text]:focus{border-color:var(--acc)}
  .field-mw{display:flex;align-items:center;gap:16px}
  .field-mw input[type=range]{flex:1}
  .mw-readout{font-family:var(--display);font-size:32px;color:var(--acc);white-space:nowrap;line-height:1}
  .mw-readout i{font-family:var(--mono);font-size:13px;color:var(--mut);font-style:normal;margin-left:4px}
  .modal-coords{font-family:var(--mono);font-size:11px;color:var(--mut2);margin-top:14px}
  .modal-actions{display:flex;align-items:center;gap:9px;margin-top:24px}
  .modal-actions .spacer{flex:1}
  .btn-go{background:var(--acc);color:#04140e;font-weight:700;border:none;padding:11px 20px;
    border-radius:9px;font-family:var(--mono);font-size:13px;cursor:pointer}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--soft);padding:11px 16px;
    border-radius:9px;font-family:var(--mono);font-size:13px;cursor:pointer}
  .btn-ghost:hover{color:var(--ink)}
  .btn-del{background:transparent;border:1px solid color-mix(in srgb,var(--red) 50%,var(--line));
    color:var(--red);padding:11px 16px;border-radius:9px;font-family:var(--mono);font-size:13px;cursor:pointer}
  .btn-del:hover{background:color-mix(in srgb,var(--red) 12%,transparent)}

  /* ---------------------------- RESPONSIVE ------------------------------ */
  @media (max-width:1000px){
    .layout{grid-template-columns:1fr}
    .map-svg{max-height:none}
    .methodology{grid-template-columns:1fr}
    .topreadout{width:100%;justify-content:flex-start}
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="data.js"></script>
<script src="engine.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="map.jsx"></script>
<script type="text/babel" src="panel.jsx"></script>
<script type="text/babel" src="conclusions.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
